name: Server CI

on:
  pull_request:
    paths:
      - "Server/**"
      - "ICQMessenger.sln"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    paths:
      - "Server/**"
      - "ICQMessenger.sln"
      - ".github/workflows/server-ci.yml"

jobs:
  build:
    name: Build ICQ.Server
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          # Reuse NuGet global packages between runs (keyed by lock/csproj hash)
          cache: true
          cache-dependency-path: |
            Server/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore ICQMessenger.sln --verbosity minimal

      - name: Build
        run: dotnet build ICQMessenger.sln --no-restore -c Release -warnaserror

      - name: Publish (smoke)
        run: dotnet publish Server/ICQ.Server.csproj --no-build -c Release -o /tmp/icq-publish
